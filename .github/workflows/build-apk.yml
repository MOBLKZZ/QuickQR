name: Build Vanilla Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Organizar arquivos em uma pasta web (www)
      run: |
        mkdir www
        # Move todos os arquivos do site para dentro da pasta www, exceto pastas de sistema como .git e .github
        find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name '.github' ! -name 'www' -exec mv {} www/ \;

    - name: Instalar Capacitor
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Inicializar Capacitor apontando para a pasta www
      run: |
        npx cap init "QuickQR" "com.quickqr.app" --web-dir "www"

    - name: Adicionar plataforma Android e Sincronizar
      run: |
        npx cap add android
        npx cap sync android

    - name: Configurar Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Gerar o APK de Debug
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Salvar o APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
